name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o DiagFarbord.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Gradle wrapper
        run: cd DiagFarbord && gradle wrapper --gradle-version 8.9 && chmod +x gradlew
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build APK
        run: cd DiagFarbord && ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diag-farbord-apk
          path: DiagFarbord/app/build/outputs/apk/debug/*.apk
